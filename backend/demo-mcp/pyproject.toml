[project]
name = "demo-mcp"
version = "0.1.0"
description = "MCP server: Scenario clock and reset for the synthetic demo (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
demo-mcp = "demo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
