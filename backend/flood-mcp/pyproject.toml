[project]
name = "flood-mcp"
version = "0.1.0"
description = "MCP server: River gauges and flood extent (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
flood-mcp = "flood_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flood_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }