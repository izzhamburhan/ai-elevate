[project]
name = "mlpredict-mcp"
version = "0.1.0"
description = "MCP server: local ML predictions (footfall, booth locations, site failure risk, congestion forecast, anomalies) on synthetic data."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "netintel-mcp",
    "fastmcp>=4.1",
    "duckdb>=1.0",
    "numpy>=2.2",
    "lightgbm>=4.5",
    "scikit-learn>=1.6",
]

[project.scripts]
mlpredict-mcp = "mlpredict_mcp.server:main"
mlpredict-data = "mlpredict_mcp.data:main"
mlpredict-train = "mlpredict_mcp.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpredict_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
netintel-mcp = { workspace = true }