[project]
name = "ontology-mcp"
version = "0.1.0"
description = "MCP server: Linked objects for towers: blast radius, neighbours, upstream dependencies and incidents (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
ontology-mcp = "ontology_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
