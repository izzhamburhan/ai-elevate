[project]
name = "ookla-mcp"
version = "0.1.0"
description = "MCP server: Ookla Open Data speed tiles for Malaysia as an H3 hexbin layer (real data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
    "duckdb>=1.5.6",
]

[project.scripts]
ookla-mcp = "ookla_mcp.server:main"
ookla-build-layer = "ookla_mcp.build_layer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ookla_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
