[project]
name = "user-mcp"
version = "0.1.0"
description = "MCP server: subscriber serving cell and experience, PII masked (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
user-mcp = "user_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
