[project]
name = "care-mcp"
version = "0.1.0"
description = "MCP server: Customer impact, drafted notices in four languages, and sending them (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
care-mcp = "care_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }