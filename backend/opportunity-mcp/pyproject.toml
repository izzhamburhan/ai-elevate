[project]
name = "opportunity-mcp"
version = "0.1.0"
description = "MCP server: Telco Opportunity Graph over NetOps/netintel/ML data plus a small synthetic SME demand seed. Synthetic data."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
    "duckdb>=1.0",
    "networkx>=3.4",
]

[project.scripts]
opportunity-mcp = "opportunity_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
