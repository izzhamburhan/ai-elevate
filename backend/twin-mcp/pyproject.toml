[project]
name = "twin-mcp"
version = "0.1.0"
description = "MCP server: Digital twin: simulate a tower failure or a tilt change before acting (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
twin-mcp = "twin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
