[project]
name = "netintel-mcp"
version = "0.1.0"
description = "MCP server: network intelligence over NetOps data (complaints, congestion, incident correlation, weather exposure, maintenance). Synthetic data."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
    "duckdb>=1.0",
    "numpy>=2.2",
    "httpx>=0.27",
]

[project.scripts]
netintel-mcp = "netintel_mcp.server:main"
netintel-seed = "netintel_mcp.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netintel_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }