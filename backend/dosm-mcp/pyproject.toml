[project]
name = "dosm-mcp"
version = "0.1.0"
description = "MCP server: official DOSM (Department of Statistics Malaysia) open data from OpenDOSM, cached locally in DuckDB (real data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
    "duckdb>=1.5.6",
]

[project.scripts]
dosm-mcp = "dosm_mcp.server:main"
dosm-download = "dosm_mcp.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosm_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
