[project]
name = "exposure-mcp"
version = "0.1.0"
description = "MCP server: Quality on demand: profiles, a feasibility quote and a booking (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
exposure-mcp = "exposure_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exposure_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
