[project]
name = "enterprise-mcp"
version = "0.1.0"
description = "MCP server: Business customers, revenue and SLA penalty at risk, and service credits (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "fastmcp>=4.1",
]

[project.scripts]
enterprise-mcp = "enterprise_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
