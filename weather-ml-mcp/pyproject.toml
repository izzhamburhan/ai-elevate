[project]
name = "weather-ml-mcp"
version = "0.1.0"
description = "Local experimental Chronos weather forecasting and geospatial MCP tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chronos-forecasting==2.3.2",
  "torch==2.9.1",
  "fastmcp==4.1.0",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "pyarrow==26.0.0",
  "httpx==0.28.1",
  "huggingface-hub==2.2.0",
  "transformers==5.19.0",
  "accelerate==1.15.0",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
